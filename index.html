<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🔥 A Nagy Pálinka Teszt</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;min-height:100vh;background:#1a0a00;font-family:'Lora',serif;}
  body{
    background:radial-gradient(ellipse at 20% 20%,#4a1800 0%,transparent 50%),
               radial-gradient(ellipse at 80% 80%,#3d1200 0%,transparent 50%),#1a0a00;
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:28px 20px;
  }
  .flame{display:inline-block;animation:flicker 1.2s ease-in-out infinite alternate}
  @keyframes flicker{0%{transform:rotate(-2deg) scale(1)}100%{transform:rotate(2deg) scale(1.05)}}
  .logo{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(1.8rem,7vw,3rem);
    color:#f5c842;
    text-shadow:0 0 40px #f5c84255;
    letter-spacing:4px;text-align:center;margin-bottom:6px;
  }
  .sub{
    font-size:.8rem;color:#c4804a;
    letter-spacing:3px;text-transform:uppercase;
    text-align:center;margin-bottom:12px;
  }
  .divider{
    width:80px;height:1px;
    background:linear-gradient(90deg,transparent,#f5c84266,transparent);
    margin:0 auto 28px;
  }
  .btn{
    display:flex;align-items:center;gap:16px;
    width:100%;max-width:400px;
    background:rgba(255,255,255,.04);
    border:1.5px solid rgba(245,200,66,.2);
    border-radius:16px;padding:18px 20px;
    margin-bottom:12px;text-decoration:none;
    transition:all .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{background:rgba(245,200,66,.12);border-color:rgba(245,200,66,.5);transform:scale(.98)}
  .btn-icon{font-size:2rem;flex-shrink:0;line-height:1}
  .btn-text{display:flex;flex-direction:column;gap:3px}
  .btn-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.3rem;color:#f5c842;
    letter-spacing:3px;line-height:1;
  }
  .btn-desc{font-size:.75rem;color:#c4a06a;letter-spacing:1px}
  .btn-primary{
    background:linear-gradient(135deg,rgba(245,200,66,.12),rgba(232,128,10,.08));
    border-color:rgba(245,200,66,.4);
  }
  .footer{margin-top:24px;font-size:.68rem;color:#3a2010;letter-spacing:2px;text-align:center}
</style>
</head>
<body>
  <div class="logo"><span class="flame">🔥</span> A Nagy Pálinka Teszt</div>
  <div class="sub">Családi "vakon" kóstolás</div>
  <div class="divider"></div>

  <a class="btn btn-primary" href="palinka-beharangzo.html">
    <div class="btn-icon">🎬</div>
    <div class="btn-text">
      <span class="btn-title">Beharangozó</span>
      <span class="btn-desc">Küldd el a családnak előre!</span>
    </div>
  </a>

  <a class="btn" href="palinka-kviz-multiplayer-2.html">
    <div class="btn-icon">📱</div>
    <div class="btn-text">
      <span class="btn-title">Multiplayer Kvíz</span>
      <span class="btn-desc">Mindenki a saját telefonján játszik</span>
    </div>
  </a>

  <a class="btn" href="palinka-kviz-2.html">
    <div class="btn-icon">🍶</div>
    <div class="btn-text">
      <span class="btn-title">Egytelefonos Kvíz</span>
      <span class="btn-desc">Egy telefon megy körbe</span>
    </div>
  </a>

  <div class="footer">szuzsoli-hub.github.io/Palinka-kviz</div>
</body>
</html>

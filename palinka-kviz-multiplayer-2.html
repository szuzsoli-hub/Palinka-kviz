<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🔥 Pálinka Kvíz – Multiplayer</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lora:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:#1a0a00;font-family:'Lora',serif;min-height:100vh}
    .app{min-height:100vh;background:radial-gradient(ellipse at 20% 20%,#4a1800 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,#3d1200 0%,transparent 50%),#1a0a00;color:#f5e6c8;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px}
    .logo{font-family:'Playfair Display',serif;font-size:clamp(2rem,7vw,2.8rem);font-weight:700;color:#f5c842;text-shadow:0 0 40px #f5c84255;letter-spacing:-1px;text-align:center;line-height:1.1}
    .logo span{font-style:italic;color:#e8a020}
    .subtitle{font-size:.85rem;color:#c4a06a;letter-spacing:3px;text-transform:uppercase;margin-top:6px;margin-bottom:28px}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(245,200,66,.18);border-radius:20px;padding:22px 18px;width:100%;max-width:480px;backdrop-filter:blur(12px);margin-bottom:12px}
    .section-title{font-family:'Playfair Display',serif;font-size:1rem;color:#f5c842;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    input[type=text]{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(245,200,66,.25);border-radius:10px;padding:12px 14px;color:#f5e6c8;font-family:'Lora',serif;font-size:.95rem;outline:none;transition:border-color .2s;margin-bottom:8px}
    input[type=text]:focus{border-color:#f5c842}
    input[type=text]::placeholder{color:#7a6040}
    .player-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .player-row input{margin-bottom:0;flex:1}
    .remove-btn{background:rgba(255,80,80,.15);border:1px solid rgba(255,80,80,.3);color:#ff8080;border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .add-btn{background:rgba(245,200,66,.08);border:1px dashed rgba(245,200,66,.3);color:#c4a06a;border-radius:10px;padding:10px;width:100%;cursor:pointer;font-family:'Lora',serif;font-size:.9rem}
    .palinka-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .palinka-label{font-family:'Playfair Display',serif;font-size:1.1rem;color:#f5c842;width:52px;flex-shrink:0}
    select{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(245,200,66,.25);border-radius:10px;padding:12px 14px;color:#f5e6c8;font-family:'Lora',serif;font-size:.95rem;outline:none;cursor:pointer;-webkit-appearance:none}
    select option{background:#2a1000}
    .btn-primary{background:linear-gradient(135deg,#f5c842,#e8800a);border:none;border-radius:12px;padding:14px 28px;color:#1a0a00;font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;cursor:pointer;width:100%;max-width:480px;margin-top:8px;letter-spacing:.5px;transition:opacity .2s,transform .1s;box-shadow:0 4px 24px #f5c84233}
    .btn-primary:hover{opacity:.92;transform:translateY(-1px)}
    .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
    .btn-secondary{background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.3);border-radius:12px;padding:12px 24px;color:#f5c842;font-family:'Lora',serif;font-size:.95rem;cursor:pointer;width:100%;max-width:480px;margin-top:8px;transition:all .15s}
    .btn-secondary:hover{background:rgba(245,200,66,.15)}
    .game-code-box{font-family:'Playfair Display',serif;font-size:3.5rem;color:#f5c842;letter-spacing:10px;text-align:center;padding:16px 0;text-shadow:0 0 30px #f5c84244}
    .round-dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;max-width:480px}
    .round-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;border:1.5px solid rgba(245,200,66,.2);color:#7a6040;background:rgba(255,255,255,.04)}
    .round-dot.done{background:rgba(245,200,66,.12);border-color:rgba(245,200,66,.4);color:#c4a06a}
    .round-dot.active{background:linear-gradient(135deg,#f5c842,#e8800a);border-color:transparent;color:#1a0a00;box-shadow:0 0 16px #f5c84244}
    .round-header{text-align:center;margin-bottom:18px;width:100%;max-width:480px}
    .round-title{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,6vw,2rem);color:#f5c842;margin-bottom:4px}
    .round-sub{font-size:.8rem;color:#7a6040;letter-spacing:2px;text-transform:uppercase}
    .players-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:480px;margin-bottom:14px}
    .player-card{background:rgba(255,255,255,.04);border:1.5px solid rgba(245,200,66,.15);border-radius:14px;padding:12px 10px;text-align:center;transition:all .15s}
    .player-card.tapped{cursor:pointer}.player-card.tapped:hover{background:rgba(245,200,66,.08);border-color:rgba(245,200,66,.35)}
    .player-card.has-guess{border-color:rgba(245,200,66,.3);background:rgba(245,200,66,.06)}
    .p-name{font-family:'Playfair Display',serif;font-size:.95rem;color:#f5e6c8;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .p-guess{font-size:.75rem;color:#c4a06a}
    .p-guess.empty{color:#4a3020;font-style:italic}
    .p-status{font-size:.62rem;margin-top:3px}
    .online{color:#7ddc7d}.offline{color:#7a6040}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(4px);animation:fadeIn .15s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .overlay-sheet{background:#1e0e02;border:1px solid rgba(245,200,66,.25);border-radius:24px 24px 0 0;padding:24px 18px 34px;width:100%;max-width:480px;animation:slideUp .2s ease}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
    .overlay-title{font-family:'Playfair Display',serif;font-size:1.3rem;color:#f5c842;text-align:center;margin-bottom:4px}
    .overlay-sub{font-size:.8rem;color:#7a6040;text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
    .fruit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
    .fruit-btn{background:rgba(255,255,255,.05);border:1.5px solid rgba(245,200,66,.15);border-radius:12px;padding:11px 6px;color:#c4a06a;font-family:'Lora',serif;font-size:.86rem;cursor:pointer;text-align:center;transition:all .15s}
    .fruit-btn:hover,.fruit-btn.selected{background:rgba(245,200,66,.18);border-color:#f5c842;color:#f5e6c8}
    .overlay-cancel{background:transparent;border:none;color:#7a6040;font-family:'Lora',serif;font-size:.9rem;cursor:pointer;width:100%;text-align:center;padding:10px}
    .confirm-name{font-family:'Playfair Display',serif;font-size:2rem;color:#f5c842;text-align:center;margin:12px 0 6px}
    .confirm-sub{font-size:.82rem;color:#7a6040;text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
    .confirm-btns{display:flex;gap:10px}
    .confirm-yes{flex:1;background:linear-gradient(135deg,#f5c842,#e8800a);border:none;border-radius:12px;padding:14px;color:#1a0a00;font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;cursor:pointer}
    .confirm-no{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(245,200,66,.2);border-radius:12px;padding:14px;color:#c4a06a;font-family:'Playfair Display',serif;font-size:1.1rem;cursor:pointer}
    .history-toggle{background:transparent;border:none;color:#c4a06a;font-family:'Lora',serif;font-size:.85rem;cursor:pointer;width:100%;max-width:480px;text-align:center;padding:8px;letter-spacing:1px}
    .history-toggle:hover{color:#f5c842}
    .podium{display:flex;flex-direction:column;gap:10px;width:100%;max-width:480px}
    .result-row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.04);border:1px solid rgba(245,200,66,.1);border-radius:14px;padding:14px 16px}
    .result-row.gold{border-color:rgba(245,200,66,.5);background:rgba(245,200,66,.08)}
    .result-row.silver{border-color:rgba(200,200,200,.3)}
    .result-row.bronze{border-color:rgba(180,110,60,.35)}
    .rank-num{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;width:30px;text-align:center}
    .result-name{font-size:1rem;color:#f5e6c8;flex:1}
    .result-score{font-family:'Playfair Display',serif;font-size:1.3rem;color:#f5c842}
    .result-score span{font-size:.72rem;color:#7a6040}
    .reveal-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:.9rem;color:#c4a06a}
    .reveal-row:last-child{border-bottom:none}
    .reveal-answer{color:#f5c842;font-weight:600}
    .detail-chip{border-radius:8px;padding:5px 8px;font-size:.72rem;display:inline-block;margin:3px 2px 0}
    .detail-chip.ok{background:rgba(100,200,100,.12);border:1px solid rgba(100,200,100,.3);color:#7ddc7d}
    .detail-chip.fail{background:rgba(255,80,80,.1);border:1px solid rgba(255,80,80,.2);color:#ff9090}
    .divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,#f5c84255,transparent);margin:18px auto}
    .flame{display:inline-block;animation:flicker 1.2s ease-in-out infinite alternate}
    @keyframes flicker{0%{transform:rotate(-2deg) scale(1)}100%{transform:rotate(2deg) scale(1.05)}}
    .confetti-emoji{font-size:2rem;animation:bounce .6s ease infinite alternate;display:block;text-align:center}
    @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
    .error-msg{color:#ff9090;font-size:.85rem;text-align:center;margin-top:8px;max-width:480px}
    .info-msg{color:#c4a06a;font-size:.82rem;text-align:center;margin-top:8px;max-width:480px;letter-spacing:1px}
    .spin{display:inline-block;animation:spin 1s linear infinite}
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    .my-turn-banner{background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.4);border-radius:14px;padding:14px;text-align:center;width:100%;max-width:480px;margin-bottom:12px;cursor:pointer}
    .my-turn-banner:hover{background:rgba(245,200,66,.18)}
    .waiting-banner{background:rgba(255,255,255,.04);border:1px solid rgba(245,200,66,.1);border-radius:14px;padding:14px;text-align:center;width:100%;max-width:480px;margin-bottom:12px}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const FRUITS = ["Alma","Birs","Cseresznye","Dió","Eper","Körte","Málna","Meggy","Őszibarack","Sárga barack","Szeder","Szilva","Szőlő","Törköly","Vegyes"];
const ALL_PL = ["1-es","2-es","3-as","4-es","5-ös","6-os","7-es","8-as","9-es","10-es","11-es","12-es","13-as","14-es","15-ös"];

function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:5}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
}

function App() {
  const [screen, setScreen]   = useState('home');
  // setup
  const [palinkaCount, setPalinkaCount] = useState(5);
      const [setupPlayers, setSetupPlayers] = useState(['','','']);
  const PL = ALL_PL.slice(0, palinkaCount);
      const [answers, setAnswers] = useState(Array(5).fill(''));
      const changeCount = (n) => { setPalinkaCount(n); setAnswers(prev => Array(n).fill('').map((_,i)=>prev[i]||'')); };
  // host runtime
  const [gameCode, setGameCode]   = useState('');
  const [hostState, setHostState] = useState(null);
  const [onlinePlayers, setOnlinePlayers] = useState([]); // names currently connected
  // player runtime
  const [joinCode, setJoinCode] = useState('');
  const [myName, setMyName]     = useState('');
  const [peerState, setPeerState] = useState(null);
  // shared UI
  const [editing, setEditing]     = useState(null); // {ri, name}
  const [confirming, setConfirming] = useState(null); // {pi, ri} for single-phone mode
  const [tempFruit, setTempFruit] = useState('');
  const [showHistory, setShowHistory] = useState(false);
  const [error, setError]   = useState('');
  const [loading, setLoading] = useState(false);

  const peerRef    = useRef(null);
  const connsRef   = useRef({}); // host: {name: conn}
  const hostStateRef = useRef(null);
  const connRef    = useRef(null); // player: conn to host

  // keep ref in sync for use in callbacks
  useEffect(() => { hostStateRef.current = hostState; }, [hostState]);

  // ── HOST: broadcast to all players ──────────────────────────
  const broadcast = useCallback((state) => {
    const payload = { type:'state', state: {...state, answers: state.phase==='finished' ? state.answers : undefined }};
    Object.values(connsRef.current).forEach(c => { try { c.send(payload); } catch(e){} });
  }, []);

  const updateHost = useCallback((updater) => {
    setHostState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      hostStateRef.current = next;
      broadcast(next);
      return next;
    });
  }, [broadcast]);

  // ── HOST: start game ────────────────────────────────────────
  const startHostGame = () => {
    const code = genCode();
    const vp = setupPlayers.filter(p => p.trim());
    const state = { phase:'playing', currentRound:0, players:vp, answers, guesses:{}, palinkaCount };
    setGameCode(code);
    setHostState(state);
    hostStateRef.current = state;
    setError('');
    setLoading(true);
    setScreen('qm-lobby');

    const peer = new Peer('pkv2-' + code, { debug: 0 });
    peerRef.current = peer;

    peer.on('open', () => setLoading(false));
    peer.on('error', err => { setError('PeerJS hiba: ' + err.type); setLoading(false); });

    peer.on('connection', conn => {
      conn.on('open', () => {
        // send current state (without answers)
        const s = hostStateRef.current;
        conn.send({ type:'state', state: {...s, answers: undefined} });
      });

      conn.on('data', data => {
        if (data.type === 'join') {
          const name = data.name;
          connsRef.current[name] = conn;
          setOnlinePlayers(Object.keys(connsRef.current));
          // send full current state back
          const s = hostStateRef.current;
          conn.send({ type:'welcome', state: {...s, answers: undefined}, yourName: name });
        }
        else if (data.type === 'guess') {
          const { playerName, round, fruit } = data;
          setHostState(prev => {
            const next = { ...prev, guesses: { ...prev.guesses,
              [playerName]: { ...(prev.guesses[playerName]||{}), [round]: fruit }
            }};
            hostStateRef.current = next;
            broadcast(next);
            return next;
          });
        }
        else if (data.type === 'requestState') {
          const s = hostStateRef.current;
          conn.send({ type:'state', state: {...s, answers: s.phase==='finished'?s.answers:undefined} });
        }
      });

      conn.on('close', () => {
        const name = Object.entries(connsRef.current).find(([,c])=>c===conn)?.[0];
        if (name) { delete connsRef.current[name]; setOnlinePlayers(Object.keys(connsRef.current)); }
      });
    });
  };

  // ── PLAYER: join ────────────────────────────────────────────
  const joinGame = () => {
    if (!joinCode.trim() || !myName.trim()) return;
    setLoading(true); setError('');
    const peer = new Peer({ debug: 0 });
    peerRef.current = peer;
    peer.on('open', () => {
      const conn = peer.connect('pkv2-' + joinCode.toUpperCase());
      connRef.current = conn;
      let opened = false;

      conn.on('open', () => {
        opened = true;
        conn.send({ type:'join', name: myName });
      });

      conn.on('data', data => {
        if (data.type === 'welcome' || data.type === 'state') {
          setPeerState(data.state);
          setLoading(false);
          if (data.type === 'welcome') setScreen('player-game');
          if (data.state?.phase === 'finished') setScreen('player-results');
        }
      });

      conn.on('error', () => { setError('Nem sikerült csatlakozni!'); setLoading(false); });
      conn.on('close', () => setError('Kapcsolat megszakadt – frissítsd az oldalt és csatlakozz újra.'));

      setTimeout(() => { if (!opened) { setError('Időtúllépés – ellenőrizd a kódot!'); setLoading(false); } }, 10000);
    });
    peer.on('error', err => { setError('Hiba: ' + err.type); setLoading(false); });
  };

  // ── PLAYER: send guess ──────────────────────────────────────
  const sendGuess = (ri, fruit) => {
    if (connRef.current?.open) connRef.current.send({ type:'guess', playerName:myName, round:ri, fruit });
    // optimistic local update
    setPeerState(prev => prev ? { ...prev, guesses: { ...prev.guesses,
      [myName]: { ...(prev.guesses?.[myName]||{}), [ri]: fruit }
    }} : prev);
    setEditing(null); setTempFruit('');
  };

  // ── shared helpers ──────────────────────────────────────────
  const gs = screen.startsWith('qm') ? hostState : peerState;
  const effectivePalinkaCount = gs?.palinkaCount || palinkaCount;
  const effectivePL = ALL_PL.slice(0, effectivePalinkaCount);
  const getG = (name, ri) => gs?.guesses?.[name]?.[ri] || '';

  const shareResults = () => {
    if (!gs) return;
    const vp = gs.players || [];
    const scores = vp.map(n => ({ n, pts: (gs.answers||[]).filter((a,i)=>getG(n,i)===a).length })).sort((a,b)=>b.pts-a.pts);
    const rankE = i => ["🥇","🥈","🥉"][i]||`${i+1}.`;
    const lines = ["🔥 Pálinka Kvíz – Eredmények","",
      ...scores.map((s,i)=>`${rankE(i)} ${s.n}: ${s.pts}/5`),
      "","🍶 Helyes válaszok:", ...(gs.answers||[]).map((a,i)=>`  ${PL[i]}: ${a}`),
      "","📋 Mindenki tippjei:",
      ...scores.map(s=>`${s.n}: ${(gs.answers||[]).map((a,i)=>{ const g=getG(s.n,i); return `${g||"—"}${g===a?"✓":`✗(${a})`}`; }).join("  ")}`)
    ].join("\n");
    if (navigator.share) navigator.share({title:"Pálinka Kvíz",text:lines});
    else navigator.clipboard.writeText(lines).then(()=>alert("Vágólapra másolva! 📋"));
  };

  const resetAll = () => {
    try { peerRef.current?.destroy(); } catch(e){}
    peerRef.current = null; connRef.current = null; connsRef.current = {};
    setScreen('home'); setHostState(null); setPeerState(null);
    setOnlinePlayers([]); setGameCode(''); setError(''); setLoading(false);
    setSetupPlayers(['','','']); setAnswers(['','','','','']);
    setMyName(''); setJoinCode('');
  };

  // Results screen helper (shared between host+player)
  const ResultsScreen = () => {
    if (!gs) return null;
    const vp = gs.players || [];
    const gCount = (gs.answers||[]).length || effectivePalinkaCount;
    const scores = vp.map(n=>({n, pts:(gs.answers||[]).filter((a,i)=>getG(n,i)===a).length})).sort((a,b)=>b.pts-a.pts);
    const rankE = i=>["🥇","🥈","🥉"][i]||`${i+1}.`;
    const rankC = i=>["gold","silver","bronze"][i]||"";
    return (<>
      <span className="confetti-emoji">🎉</span>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:"1.5rem",color:"#f5c842",marginTop:"10px",marginBottom:"22px"}}>Eredmények</div>
      <div className="podium">{scores.map((s,i)=>(
        <div key={s.n} className={`result-row ${rankC(i)}`}>
          <div className="rank-num">{rankE(i)}</div>
          <div className="result-name">{s.n}</div>
          <div className="result-score">{s.pts}<span> / {gCount}</span></div>
        </div>
      ))}</div>
      {gs.answers && <>
        <div className="divider"/>
        <div className="card">
          <div className="section-title">🔍 Helyes válaszok</div>
          {gs.answers.map((a,i)=><div className="reveal-row" key={i}><span>{PL[i]} pálinka</span><span className="reveal-answer">{a}</span></div>)}
        </div>
        <div className="card">
          <div className="section-title">📊 Részletes találatok</div>
          {scores.map(s=>(
            <div key={s.n} style={{marginBottom:"13px"}}>
              <div style={{fontSize:".82rem",color:"#c4a06a",marginBottom:"5px"}}>{s.n}</div>
              <div>{gs.answers.map((a,i)=>{const g=getG(s.n,i);const ok=g===a;return <span key={i} className={`detail-chip ${ok?"ok":"fail"}`}>{PL[i]}: {g||"—"} {ok?"✓":`✗(${a})`}</span>})}</div>
            </div>
          ))}
        </div>
      </>}
      <button className="btn-primary" onClick={shareResults} style={{marginTop:"14px"}}>📤 Eredmények megosztása</button>
      <button className="btn-secondary" onClick={resetAll}>↺ Új játék</button>
    </>);
  };

  return (
    <div className="app">
      <div className="logo"><span className="flame">🔥</span> Pálinka<span> Kvíz</span></div>
      <div className="subtitle">Multiplayer · Vak kóstolóverseny</div>

      {/* ══ HOME ══════════════════════════════════════════ */}
      {screen==='home' && <>
        <div className="card" style={{textAlign:'center',padding:'28px 20px',marginBottom:'20px'}}>
          <div style={{fontSize:'2.5rem',marginBottom:'12px'}}>🍶</div>
          <div style={{fontSize:'.9rem',color:'#c4a06a',lineHeight:'1.6'}}>
            A kvízmester elindítja a játékot,<br/>a játékosok csatlakoznak a saját telefonjukon.
          </div>
        </div>
        <button className="btn-primary" onClick={()=>setScreen('qm-setup')}>🎩 Kvízmester vagyok</button>
        <button className="btn-secondary" onClick={()=>setScreen('player-join')}>🙋 Játékos vagyok</button>
      </>}

      {/* ══ QM SETUP ══════════════════════════════════════ */}
      {screen==='qm-setup' && <>
        <div className="card">
          <div className="section-title">👥 Játékosok</div>
          {setupPlayers.map((p,i)=>(
            <div className="player-row" key={i}>
              <input type="text" placeholder={`${i+1}. játékos neve`} value={p} onChange={e=>{const a=[...setupPlayers];a[i]=e.target.value;setSetupPlayers(a)}} maxLength={16}/>
              {setupPlayers.length>2 && <button className="remove-btn" onClick={()=>setSetupPlayers(setupPlayers.filter((_,idx)=>idx!==i))}>✕</button>}
            </div>
          ))}
          {setupPlayers.length<15 && <button className="add-btn" onClick={()=>setSetupPlayers([...setupPlayers,''])}>+ Játékos hozzáadása</button>}
        </div>
        <div className="card">
          <div className="section-title">🍶 Hány pálinka lesz?</div>
              <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'4px'}}>
                {Array.from({length:15},(_,i)=>i+1).map(n=>(
                  <button key={n} onClick={()=>changeCount(n)} style={{background:palinkaCount===n?'rgba(245,200,66,.25)':'rgba(255,255,255,.05)',border:`1.5px solid ${palinkaCount===n?'#f5c842':'rgba(245,200,66,.2)'}`,borderRadius:'8px',padding:'8px 14px',color:palinkaCount===n?'#f5c842':'#7a6040',fontFamily:"'Lora',serif",fontSize:'.9rem',cursor:'pointer'}}>{n}</button>
                ))}
              </div>
            </div>
            <div className="card">
              <div className="section-title">🍶 Helyes válaszok</div>
          <div style={{fontSize:'.78rem',color:'#7a6040',marginBottom:'12px'}}>Csak a kvízmester látja!</div>
          {answers.slice(0,palinkaCount).map((a,i)=>(
            <div className="palinka-row" key={i}>
              <div className="palinka-label">{PL[i]}</div>
              <select value={a} onChange={e=>{const arr=[...answers];arr[i]=e.target.value;setAnswers(arr)}}>
                <option value="">— válassz —</option>
                {FRUITS.map(f=><option key={f} value={f}>{f}</option>)}
              </select>
            </div>
          ))}
        </div>
        <button className="btn-primary"
          disabled={setupPlayers.filter(p=>p.trim()).length<2 || !answers.every(a=>a)}
          onClick={startHostGame}>Játék indítása →</button>
        <button className="btn-secondary" onClick={()=>setScreen('home')}>← Vissza</button>
      </>}

      {/* ══ QM LOBBY ══════════════════════════════════════ */}
      {screen==='qm-lobby' && <>
        <div className="card" style={{textAlign:'center'}}>
          <div className="section-title" style={{justifyContent:'center'}}>🔑 Játékkód</div>
          {loading
            ? <div style={{color:'#c4a06a',fontSize:'1rem',padding:'20px 0'}}><span className="spin">⏳</span> Kapcsolódás...</div>
            : <div className="game-code-box">{gameCode}</div>
          }
          <div style={{fontSize:'.78rem',color:'#7a6040',letterSpacing:'2px',marginTop:'4px'}}>JÁTÉKOSOK ÍRJÁK BE EZT</div>
        </div>
        <div className="card">
          <div className="section-title">📱 Játékosok státusza</div>
          {hostState?.players.map(name=>(
            <div key={name} style={{display:'flex',alignItems:'center',padding:'8px 0',borderBottom:'1px solid rgba(255,255,255,.06)'}}>
              <span style={{flex:1,fontSize:'.9rem'}}>{name}</span>
              <span className={onlinePlayers.includes(name)?'online':'offline'} style={{fontSize:'.8rem'}}>
                {onlinePlayers.includes(name)?'● online':'○ vár...'}
              </span>
            </div>
          ))}
        </div>
        {error && <div className="error-msg">{error}</div>}
        <div className="info-msg" style={{marginBottom:'8px'}}>⚠️ A telefon képernyője maradjon bekapcsolva!</div>
        <button className="btn-primary" disabled={loading} onClick={()=>setScreen('qm-game')}>Játék megkezdése →</button>
      </>}

      {/* ══ QM GAME ═══════════════════════════════════════ */}
      {screen==='qm-game' && hostState && <>
        <div style={{fontSize:'.72rem',color:'#7a6040',marginBottom:'14px',letterSpacing:'2px'}}>
          KÓD: <span style={{color:'#f5c842',fontWeight:700,letterSpacing:'4px'}}>{gameCode}</span>
        </div>
        <div className="round-dots">
          {Array.from({length:effectivePalinkaCount},(_,i)=>i).map(ri=>(
            <div key={ri} className={`round-dot ${ri<hostState.currentRound?'done':ri===hostState.currentRound?'active':''}`}
              onClick={()=>updateHost(prev=>({...prev,currentRound:ri}))}>{ri+1}</div>
          ))}
        </div>
        <div className="round-header">
          <div className="round-title">🍶 {PL[hostState.currentRound]} pálinka</div>
          <div className="round-sub">
            {hostState.players.filter(n=>!!getG(n,hostState.currentRound)).length} / {hostState.players.length} tipp megvan
          </div>
        </div>
        <div className="players-grid">
          {hostState.players.map(name=>{
            const g = getG(name, hostState.currentRound);
            const online = onlinePlayers.includes(name);
            return (
              <div key={name} className={`player-card ${g?'has-guess':''}`}>
                <div className="p-name">{name}</div>
                <div className={`p-guess ${g?'':'empty'}`}>{g?'✓ Tippelt':'vár...'}</div>
                <div className={`p-status ${online?'online':'offline'}`}>{online?'● online':'○ offline'}</div>
              </div>
            );
          })}
        </div>
        {hostState.currentRound<effectivePalinkaCount-1
          ? <button className="btn-primary" onClick={()=>updateHost(p=>({...p,currentRound:p.currentRound+1}))}>Következő pálinka →</button>
          : <button className="btn-primary" onClick={()=>{updateHost(p=>({...p,phase:'finished'}));setScreen('qm-results')}}>Eredmények 🏆</button>
        }
        {hostState.currentRound>0 && <button className="btn-secondary" onClick={()=>updateHost(p=>({...p,currentRound:p.currentRound-1}))}>← Előző pálinka</button>}
      </>}

      {/* ══ QM RESULTS ════════════════════════════════════ */}
      {screen==='qm-results' && <ResultsScreen/>}

      {/* ══ PLAYER JOIN ═══════════════════════════════════ */}
      {screen==='player-join' && <>
        <div className="card">
          <div className="section-title">🔑 Játékkód</div>
          <input type="text" placeholder="pl. ABX72" value={joinCode}
            onChange={e=>setJoinCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''))}
            maxLength={5} style={{fontSize:'2rem',letterSpacing:'6px',textAlign:'center',padding:'14px'}}/>
        </div>
        <div className="card">
          <div className="section-title">👤 A te neved</div>
          <input type="text" placeholder="Írd be a neved" value={myName} onChange={e=>setMyName(e.target.value)} maxLength={16}/>
        </div>
        {error && <div className="error-msg">{error}</div>}
        <button className="btn-primary" disabled={!joinCode||!myName||loading} onClick={joinGame}>
          {loading ? <><span className="spin">⏳</span> Csatlakozás...</> : 'Csatlakozás →'}
        </button>
        <button className="btn-secondary" onClick={()=>setScreen('home')}>← Vissza</button>
      </>}

      {/* ══ PLAYER GAME ═══════════════════════════════════ */}
      {screen==='player-game' && <>
        {!peerState
          ? <div className="waiting-banner"><span className="spin">⏳</span> Szinkronizálás...</div>
          : <>
            <div style={{fontSize:'.82rem',color:'#c4a06a',marginBottom:'10px',textAlign:'center'}}>
              👋 {myName}
            </div>
            <div className="round-dots">
              {Array.from({length:palinkaCount},(_,i)=>i).map(ri=>(
                <div key={ri} className={`round-dot ${ri<peerState.currentRound?'done':ri===peerState.currentRound?'active':''}`}>{ri+1}</div>
              ))}
            </div>
            <div className="round-header">
              <div className="round-title">🍶 {PL[peerState.currentRound]} pálinka</div>
              <div className="round-sub">{getG(myName,peerState.currentRound)?'✓ tippeltél':'még nem tippeltél'}</div>
            </div>

            {/* Current round tipping card */}
            <div
              className={getG(myName,peerState.currentRound)?'my-turn-banner':'my-turn-banner'}
              style={{background: getG(myName,peerState.currentRound)?'rgba(245,200,66,.1)':'rgba(245,200,66,.06)'}}
              onClick={()=>{setEditing({ri:peerState.currentRound,name:myName});setTempFruit(getG(myName,peerState.currentRound))}}>
              {getG(myName,peerState.currentRound)
                ? <>
                    <div style={{fontSize:'1.4rem',color:'#f5c842',fontFamily:"'Playfair Display',serif"}}>{getG(myName,peerState.currentRound)}</div>
                    <div style={{fontSize:'.72rem',color:'#7a6040',marginTop:'4px'}}>✏️ kattints a módosításhoz</div>
                  </>
                : <>
                    <div style={{fontSize:'1rem',color:'#c4a06a'}}>🍶 Tippelj erre a pálinára →</div>
                  </>
              }
            </div>

            {/* Mások státusza */}
            <div className="card" style={{marginBottom:'10px'}}>
              <div className="section-title">👥 Ki tippelt már?</div>
              {(peerState.players||[]).map(name=>{
                const g = getG(name, peerState.currentRound);
                return (
                  <div key={name} style={{display:'flex',alignItems:'center',padding:'6px 0',borderBottom:'1px solid rgba(255,255,255,.04)'}}>
                    <span style={{flex:1,fontSize:'.88rem',color: name===myName?'#f5c842':'#f5e6c8'}}>{name}{name===myName?' (te)':''}</span>
                    <span style={{fontSize:'.8rem',color:g?'#7ddc7d':'#7a6040'}}>{g?'✓':'○'}</span>
                  </div>
                );
              })}
            </div>

            {/* Previous rounds correction */}
            {peerState.currentRound > 0 && <>
              <button className="history-toggle" onClick={()=>setShowHistory(h=>!h)}>
                {showHistory?'▲ Korábbi tippek elrejtése':'✏️ Korábbi tippek javítása'}
              </button>
              {showHistory && (
                <div className="card" style={{marginBottom:'10px'}}>
                  {Array.from({length:effectivePalinkaCount},(_,i)=>i).slice(0,peerState.currentRound).map(ri=>(
                    <div key={ri} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid rgba(255,255,255,.06)',cursor:'pointer'}}
                      onClick={()=>{setEditing({ri,name:myName});setTempFruit(getG(myName,ri))}}>
                      <span style={{color:'#c4a06a',fontSize:'.88rem'}}>{PL[ri]} pálinka</span>
                      <span style={{color:getG(myName,ri)?'#f5c842':'#4a3020',fontSize:'.88rem'}}>
                        {getG(myName,ri)||'—'} {getG(myName,ri)&&'✏️'}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </>}

            {error && <div className="error-msg">{error}</div>}
          </>
        }
      </>}

      {/* ══ PLAYER RESULTS ════════════════════════════════ */}
      {screen==='player-results' && <ResultsScreen/>}

      {/* ══ FRUIT PICKER OVERLAY ══════════════════════════ */}
      {editing !== null && (
        <div className="overlay" onClick={()=>setEditing(null)}>
          <div className="overlay-sheet" onClick={e=>e.stopPropagation()}>
            <div className="overlay-title">{editing.name || myName}</div>
            <div className="overlay-sub">{PL[editing.ri]} pálinka – melyik gyümölcs?</div>
            <div className="fruit-grid">
              {FRUITS.map(f=><button key={f} className={`fruit-btn ${tempFruit===f?'selected':''}`} onClick={()=>setTempFruit(f)}>{f}</button>)}
            </div>
            <button className="btn-primary" disabled={!tempFruit} onClick={()=>{
              if (screen==='player-game') sendGuess(editing.ri, tempFruit);
              else setEditing(null);
            }}>Mentés ✓</button>
            <button className="overlay-cancel" onClick={()=>setEditing(null)}>Mégse</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>

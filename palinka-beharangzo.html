<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔥 A Nagy Pálinka Teszt</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@700&family=Lora:ital@1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%}
  body{
    width:100%;height:100%;
    background:#000;
    font-family:'Bebas Neue',sans-serif;
    overflow:hidden;
  }
  canvas{
    position:absolute;top:0;left:0;
    width:100%;height:100%;
  }
  #stage{
    position:absolute;top:0;left:0;
    width:100%;height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    padding:16px 16px 80px;
    pointer-events:none;
  }
  .line{
    opacity:0;
    text-align:center;
    width:100%;
    line-height:1.1;
  }
  #l-title{
    font-size:clamp(1.4rem,5.5vw,2.4rem);
    color:#fff;
    letter-spacing:3px;
    text-shadow:0 0 30px #ff8800,0 2px 0 #000;
  }
  #l-sub{
    font-family:'Lora',serif;font-style:italic;
    font-size:clamp(.65rem,2.4vw,0.88rem);
    color:#c4804a;letter-spacing:3px;
    margin-top:6px;
  }
  #l-sep{
    width:0;height:2px;
    background:linear-gradient(90deg,transparent,#f5c842,transparent);
    transition:width 1s ease;
    flex-shrink:0;
  }
  #l-ki{
    font-family:'Cinzel',serif;
    font-size:clamp(.9rem,3.5vw,1.5rem);
    color:#c4a06a;letter-spacing:3px;
  }
  #l-mester{
    font-size:clamp(2.5rem,11vw,5rem);
    color:#fff;letter-spacing:3px;
    text-shadow:0 0 50px #ff8800,0 3px 0 #000;
  }
  #l-szombat{
    font-size:clamp(3rem,13vw,5.5rem);
    color:#f5c842;letter-spacing:6px;
    text-shadow:0 0 40px #f5c842,0 3px 0 #000;
  }
  #l-eldol{
    font-size:clamp(2rem,9vw,4rem);
    color:#fff;letter-spacing:6px;
    text-shadow:0 0 30px #ff8800,0 3px 0 #000;
  }
  #l-hamarosan{
    font-size:clamp(2.2rem,10vw,4.5rem);
    color:#fff;letter-spacing:6px;
    text-shadow:0 0 60px #ff8800,0 0 120px #ff4400,0 4px 0 #000;
  }
  #l-tuz{
    font-size:clamp(1.8rem,7vw,3rem);
    filter:drop-shadow(0 0 15px #ff6600);
  }
  #btn-restart{
    position:absolute;
    bottom:16px;left:50%;
    transform:translateX(-50%);
    opacity:0;pointer-events:none;
    background:rgba(245,200,66,.12);
    border:1.5px solid rgba(245,200,66,.4);
    border-radius:40px;
    padding:12px 32px;
    color:#f5c842;
    font-family:'Cinzel',serif;
    font-size:clamp(.85rem,3vw,1rem);
    letter-spacing:3px;
    cursor:pointer;
    white-space:nowrap;
    transition:all .3s;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes crashIn{from{transform:translateY(-30px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeUp{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes slam{0%{transform:scale(1.8);opacity:0}70%{transform:scale(.97)}100%{transform:scale(1);opacity:1}}
  @keyframes pulse{0%,100%{text-shadow:0 0 50px #ff8800,0 3px 0 #000}50%{text-shadow:0 0 90px #ffaa00,0 3px 0 #000}}
  @keyframes goldP{0%,100%{text-shadow:0 0 40px #f5c842,0 3px 0 #000}50%{text-shadow:0 0 80px #f5c842,0 3px 0 #000}}
  @keyframes bigP{0%,100%{text-shadow:0 0 60px #ff8800,0 4px 0 #000}50%{text-shadow:0 0 110px #ffbb00,0 4px 0 #000}}
  @keyframes btnIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stage">
  <div class="line" id="l-title">A NAGY PÁLINKA TESZT</div>
  <div class="line" id="l-sub">Családi "vakon" kóstolás</div>
  <div id="l-sep"></div>
  <div class="line" id="l-ki">KI A LEGNAGYOBB</div>
  <div class="line" id="l-mester">PÁLINKÁS<br>A CSALÁDBAN!?</div>
  <div class="line" id="l-szombat">SZOMBATON</div>
  <div class="line" id="l-eldol">ELDŐL!</div>
  <div class="line" id="l-hamarosan">HAMAROSAN</div>
  <div class="line" id="l-tuz">🔥🍶🔥</div>
</div>
<button id="btn-restart">↺ ÚJRA</button>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,parts=[],raf,intense=false;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

class P{
  constructor(){this.reset();}
  reset(){
    this.x=W/2+(Math.random()-.5)*(intense?W*.8:W*.4);
    this.y=H+Math.random()*40;
    this.vx=(Math.random()-.5)*1.3;
    this.vy=-(1.8+Math.random()*(intense?5:2.8));
    this.life=0;this.max=70+Math.random()*80;
    this.r=(intense?3:1.5)+Math.random()*(intense?8:4.5);
    this.ember=Math.random()<.25;
  }
  tick(){this.x+=this.vx+Math.sin(this.life*.09)*.8;this.y+=this.vy;this.vy*=.99;this.life++;if(this.life>this.max)this.reset();}
  draw(){
    const t=this.life/this.max,a=t<.2?t/.2:1-(t-.2)/.8;
    if(a<=0)return;
    if(this.ember){ctx.globalAlpha=a;ctx.fillStyle=t<.5?'#ffcc44':'#ff7700';ctx.beginPath();ctx.arc(this.x,this.y,this.r*.25,0,Math.PI*2);ctx.fill();}
    else{
      const h=t<.3?5:t<.6?25:45,g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*(1-t*.4));
      g.addColorStop(0,`hsla(${h},100%,80%,${a})`);g.addColorStop(.5,`hsla(${h},100%,55%,${a*.6})`);g.addColorStop(1,`hsla(${h},100%,40%,0)`);
      ctx.globalAlpha=.9;ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,this.r*(1-t*.3),0,Math.PI*2);ctx.fill();
    }
  }
}
function spawn(n){for(let i=0;i<n;i++)parts.push(new P());}
function fire(){raf=requestAnimationFrame(fire);ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(0,0,W,H);parts.forEach(p=>{p.tick();p.draw();});ctx.globalAlpha=1;}

const el=id=>document.getElementById(id);
const w=ms=>new Promise(r=>setTimeout(r,ms));
const IDS=['l-ki','l-mester','l-szombat','l-eldol','l-hamarosan','l-tuz'];

function show(id,anim){const e=el(id);e.style.opacity='1';if(anim)e.style.animation=anim;}
function hideAll(dur=450){
  IDS.forEach(id=>{const e=el(id);e.style.transition=`opacity ${dur}ms`;e.style.opacity='0';setTimeout(()=>{e.style.transition='';e.style.animation='none';},dur);});
  return w(dur);
}
function reset(){
  IDS.forEach(id=>{const e=el(id);e.style.opacity='0';e.style.animation='none';e.style.transition='';});
  el('l-title').style.opacity='0';el('l-sub').style.opacity='0';
  el('l-sep').style.width='0';
  const b=el('btn-restart');b.style.opacity='0';b.style.pointerEvents='none';b.style.animation='none';
}

async function run(){
  reset();parts=[];intense=false;cancelAnimationFrame(raf);
  spawn(50);fire();
  await w(700);spawn(35);

  // Főcím
  await w(500);
  show('l-title','crashIn .6s ease forwards');
  await w(400);
  show('l-sub','fadeIn .7s ease forwards');
  await w(500);
  el('l-sep').style.width='180px';
  await w(800);

  // Ki a legnagyobb?
  intense=true;spawn(65);
  show('l-ki','fadeUp .5s ease forwards');
  await w(350);
  show('l-mester','slam .6s cubic-bezier(.2,1.4,.3,1) forwards');
  await w(500);
  el('l-mester').style.animation='slam .6s cubic-bezier(.2,1.4,.3,1) forwards,pulse 2s ease .6s infinite';
  await w(2200);

  // Szombaton eldől
  await hideAll();
  await w(300);
  intense=true;spawn(80);
  show('l-szombat','crashIn .5s ease forwards');
  await w(380);
  el('l-szombat').style.animation='crashIn .5s ease forwards,goldP 2s ease .5s infinite';
  show('l-eldol','fadeUp .5s ease .2s forwards');
  await w(2200);

  // Hamarosan
  await hideAll();
  await w(350);
  intense=true;spawn(110);
  show('l-hamarosan','slam .7s cubic-bezier(.2,1.4,.3,1) forwards');
  await w(550);
  el('l-hamarosan').style.animation='slam .7s cubic-bezier(.2,1.4,.3,1) forwards,bigP 1.8s ease .7s infinite';
  show('l-tuz','fadeIn .8s ease .3s forwards');
  await w(2000);

  const b=el('btn-restart');
  b.style.animation='btnIn .5s ease forwards';
  b.style.opacity='1';b.style.pointerEvents='all';
}

el('btn-restart').addEventListener('click',()=>{cancelAnimationFrame(raf);run();});
run();
</script>
</body>
</html>
